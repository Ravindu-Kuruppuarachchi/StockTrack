# --- GLOBAL SETTINGS ---
fullname: inventory-app

app:
  enabled: false

common:
  enabled: true

labels:
  app: inventory-app
  tier: backend
  owner: "devops-team"



# --- DATABASE CONFIGURATION ---
postgresql:
  enabled: true
  image:
    repository: ravindukuruppuarachchi/inventory_project_db  # <--- CHANGED
    tag: "latest"  # <--- Will be overridden by Jenkins
    pullPolicy: IfNotPresent
  replicas: 1
  containerName: "postgres"
  mountPath: "/var/lib/postgresql/data"
  storage:
    size: 50Gi
    accessMode: ReadWriteOnce

# --- SERVICES (Map Format) ---
myServices:
  # Disable backend service for DB release
  backend:
    enabled: false

  postgres:
    name: postgres-service
    enabled: true
    type: ClusterIP
    headless: true
    port: 5432  # cannot edit 
    targetPort: 5432
    selector:
      app: postgres

# --- SECRETS & CONFIG (DB Parts) ---

myConfigMaps:
  # Enable DB Config
  db:
    enabled: true
    suffix: "db-config"
    data:
      postgres-user: "postgres"
      postgres-db: "inventory_db"
  
  # Disable App Config
  app:
    enabled: false

serviceAccount:
  create: false
  
secrets:
  postgresPassword: "airarabia" #injected via Jenkinsfile