# Staging environment values
# Usage: helm install inventory-stage ./helm/inventory-app -f ./helm/inventory-app/values-stage.yaml

app:
  name: inventory-app
  replicaCount: 2

image:
  repository: inventory_project_api
  tag: "stage"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

# Ingress for staging
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: inventory-stage.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Moderate resources for staging
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Enable autoscaling with lower thresholds
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Staging ConfigMap
configMap:
  postgresUser: "postgres"
  postgresDb: "inventory_stage"
  adminEmail: "admin@stage.example.com"
  databaseUrl: "postgresql://postgres:stagepassword@postgres-service:5432/inventory_stage"

# Staging secrets
secrets:
  postgresPassword: "stagepassword"
  adminPassword: "StagePassword456!"

# PostgreSQL for staging
postgresql:
  enabled: true
  image: "postgres:15"
  replicas: 1
  storage:
    size: 5Gi
    accessMode: ReadWriteOnce

# Standard health checks
livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 20
  periodSeconds: 15

readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
