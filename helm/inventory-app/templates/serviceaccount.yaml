{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  # 1. Use the name directly from values, defaulting if empty
  name: {{ .Values.serviceAccount.name | default "inventory-sa" }}
  labels:
    # 2. Use toYaml for labels
    {{- toYaml .Values.labels | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}