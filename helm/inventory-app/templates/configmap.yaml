apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inventory-app.fullname" . }}-config
  labels:
    {{- include "inventory-app.labels" . | nindent 4 }}
data:
  postgres-user: {{ .Values.configMap.postgresUser | quote }}
  postgres-db: {{ .Values.configMap.postgresDb | quote }}
  admin-email: {{ .Values.configMap.adminEmail | quote }}
  database-url: {{ .Values.configMap.databaseUrl | quote }}
