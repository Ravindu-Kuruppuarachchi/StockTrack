apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inventory-app.fullname" . }}-secret
  labels:
    {{- include "inventory-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  admin-password: {{ .Values.secrets.adminPassword | quote }}
