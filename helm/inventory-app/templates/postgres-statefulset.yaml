{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.fullname }}-statefulset
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
spec:

  serviceName: {{ .Values.myServices.postgres.name | quote }}
  replicas: {{ .Values.postgresql.replicas }}
  selector:
    matchLabels:
      {{- toYaml .Values.myServices.postgres.selector | nindent 6 }}
  template:
    metadata:
      labels:
        # Merge global labels with specific postgres selector labels
        {{- toYaml .Values.labels | nindent 8 }}
        {{- toYaml .Values.myServices.postgres.selector | nindent 8 }}
    spec:
      containers:
      - name: {{ .Values.postgresql.containerName | default "postgres" }}
        image: {{ .Values.postgresql.image }}
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER #hardcoded due to software inside the container is hard-coded to look for this specific value
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.fullname }}-db-config
              key: postgres-user
        - name: POSTGRES_PASSWORD #These keys represent the connection between your configmap.yaml and your statefulset.yaml.
          valueFrom:
            secretKeyRef:
              name: {{ .Values.fullname }}-db-secret
              key: postgres-password
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.fullname }}-db-config
              key: postgres-db
                
        volumeMounts:
        - name: postgres-storage
          mountPath: {{ .Values.postgresql.mountPath }}
          
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ {{ .Values.postgresql.storage.accessMode | quote }} ]
      resources:
        requests:
          storage: {{ .Values.postgresql.storage.size }}
{{- end }}