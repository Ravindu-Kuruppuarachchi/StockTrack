# Production environment values
# Usage: helm install inventory-prod ./helm/inventory-app -f ./helm/inventory-app/values-prod.yaml

app:
  name: inventory-app
  replicaCount: 3

image:
  repository: inventory_project_api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Pod annotations for monitoring
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

# Security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

# Production ingress with TLS
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: inventory.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: inventory-tls
      hosts:
        - inventory.example.com

# Production-grade resources
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Production autoscaling
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  targetCPUUtilizationPercentage: 80

# Production affinity for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - inventory-app
          topologyKey: kubernetes.io/hostname

# Production ConfigMap (use external managed database)
configMap:
  postgresUser: "inventory_user"
  postgresDb: "inventory_prod"
  adminEmail: "admin@example.com"
  databaseUrl: "postgresql://inventory_user:${DB_PASSWORD}@prod-postgresql.database.svc.cluster.local:5432/inventory_prod"

# Production secrets - should be set via CI/CD or external secrets
secrets:
  postgresPassword: ""
  adminPassword: ""

# Disable PostgreSQL StatefulSet - use external managed database
postgresql:
  enabled: false

# Strict health checks
livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 5
