version: '3.8'

services:
  db:
    image: postgres:15
    container_name: inventory_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: airarabia
      POSTGRES_DB: inventory_db
    ports:
      # Host Port : Container Port
      - "5433:5432" 
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory_net

  api:
    build:
      context: ../                                #  Steps back to parent folder
      dockerfile: project_docker_k8s_helm/Dockerfile  # Points back down to file
    image: inventory_project_api:multistage
    container_name: inventory_api
    ports:
      - "8000:8000"
    environment:
      # <--- CHANGE 2: Used 'db' instead of 'localhost', and port 5432 (internal port)
      DATABASE_URL: postgresql://postgres:airarabia@db:5432/inventory_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - inventory_net

volumes:
  db_data:

networks:
  inventory_net:
    driver: bridge