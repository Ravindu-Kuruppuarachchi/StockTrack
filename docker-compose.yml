version: '3.8'

services:
  db:
    image: postgres:15
    container_name: inventory_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: airarabia
      POSTGRES_DB: inventory_db
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: inventory_project_api:multistage
    container_name: inventory_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:airarabia@db:5432/inventory_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app



volumes:
  db_data:



