<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Inventory System{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link href="{{ url_for('static', path='/css/styles.css') }}?v={{ range(100000, 999999)|random }}" rel="stylesheet">
</head>
<body>

<div class="wrapper">
    <nav id="sidebar" class="p-3">
        <div class="sidebar-header pb-3 border-bottom border-secondary">
            <h3 class="fw-bold"><i class="fa-solid fa-boxes-stacked me-2"></i>StockTrack</h3>
        </div>

        <ul class="list-unstyled components pt-4">
            <li class="mb-2">
                <a href="/sales" class="nav-link"><i class="fa-solid fa-chart-line me-2"></i> Sales</a>
            </li>
            <li class="mb-2">
                <a href="/products" class="nav-link"><i class="fa-solid fa-shirt me-2"></i> Products</a>
            </li>
            <li class="mb-2">
                <a href="/orders" class="nav-link"><i class="fa-solid fa-cart-shopping me-2"></i> Orders</a>
            </li>
            <li class="mb-2">
                <a href="/suppliers" class="nav-link"><i class="fa-solid fa-truck me-2"></i> Suppliers</a>
            </li>
        </ul>
    </nav>

    <main>
        <nav class="navbar navbar-expand-lg navbar-light bg-white rounded shadow-sm mb-4 px-3">
            <div class="container-fluid">
                <div class="ms-auto d-flex align-items-center">
                    <span class="me-3 fw-bold text-light">Welcome, Admin</span>
                    <a href="/login/update" class="btn btn-outline-light btn-sm me-2">
                        <i class="fa-solid fa-user-gear"></i> User Details
                    </a>
                    <a href="/logout" class="btn btn-danger btn-sm">
                        <i class="fa-solid fa-right-from-bracket"></i> Logout
                    </a>
                </div>
            </div>
        </nav>

        <div class="container-fluid p-0">
            {% block content %}
            {% endblock %}
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
