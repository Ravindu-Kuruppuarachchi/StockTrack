apiVersion: autoscaling/v1 # Specifies version of K8s API schema to use
kind: HorizontalPodAutoscaler # Specifies we are creating an HPA
metadata:
  name: inventory-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1 # API version of the target resource
    kind: Deployment
    name: inventory-app
  minReplicas: 1 # Minimum number of pod replicas
  maxReplicas: 10 # Maximum number of pod replicas
  targetCPUUtilizationPercentage: 50  # Target average CPU utilization percentage across all pods