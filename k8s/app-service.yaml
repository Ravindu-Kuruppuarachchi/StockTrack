apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  type: NodePort
  selector:
    app: inventory-app
  ports:
    - port: 8000        # The port the service listens on inside the cluster
      targetPort: 8000  # The port your container is running on
      nodePort: 30007   # The port you will access in your browser (http://minikube-ip:30007)
